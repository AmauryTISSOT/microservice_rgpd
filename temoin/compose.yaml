name: brocanto

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: brocanto
      MARIADB_USER: brocanto
      MARIADB_PASSWORD: brocanto
    ports:
      - "3307:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - donnees:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: brocanto
      DB_PASSWORD: brocanto
      DB_NAME: brocanto
      FLASK_DEBUG: "1"
      # Le secret partagé de l'adaptateur RGPD. Il vit dans la configuration de déploiement, des
      # deux côtés ; sans lui, l'adaptateur refuse tous les appels.
      RGPD_ADAPTER_SECRET: secret-de-recette-brocanto
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  donnees:
