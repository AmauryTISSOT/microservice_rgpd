<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{% block titre %}Brocanto{% endblock %}</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; color: #2b2118; background: #faf6ef; }
    header { background: #6b4a2f; color: #faf6ef; padding: 12px 24px; }
    header a { color: #f2e4cd; text-decoration: none; margin-right: 16px; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #ddd0bb; padding: 6px 8px; text-align: left; font-size: 14px; }
    th { background: #efe3d0; }
    .annonce { border-bottom: 1px solid #e5d8c3; padding: 12px 0; }
    footer { border-top: 1px solid #ddd0bb; margin-top: 32px; padding: 16px 24px; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <a href="{{ url_for('accueil') }}">Brocanto</a>
  {% if moi %}
    <a href="{{ url_for('mon_compte') }}">Mon compte</a>
    <a href="{{ url_for('deconnexion') }}">Se déconnecter</a>
  {% else %}
    <a href="{{ url_for('connexion') }}">Se connecter</a>
  {% endif %}
</header>
<main>{% block contenu %}{% endblock %}</main>
<footer>
  <form method="post" action="{{ url_for('newsletter') }}">
    Recevoir les nouvelles annonces :
    <input type="email" name="courriel" placeholder="votre adresse" required>
    <button type="submit">Je m'inscris</button>
  </form>
  <p>Brocanto — brocante en ligne depuis 2019.
    <a href="{{ url_for('contact') }}">Nous écrire</a></p>
</footer>
</body>
</html>
