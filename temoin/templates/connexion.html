{% extends "base.html" %}
{% block contenu %}
<h1>Se connecter</h1>
{% if erreur %}<p style="color:#a33">{{ erreur }}</p>{% endif %}
<form method="post">
  <p><label>Adresse électronique <input type="email" name="email" required></label></p>
  <p><label>Mot de passe <input type="password" name="mot_de_passe"></label></p>
  <button type="submit">Entrer</button>
</form>
{% endblock %}
