[project]
name = "qualification-sidecar"
version = "1.0.0"
description = "Sidecar de qualification RGPD : les moteurs, derrière un point d'entrée HTTP chacun."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Le client compatible OpenAI par lequel le moteur LLM parle à son amont. Il n'engage pas le
    # fournisseur : `base_url` et nom de modèle sont le point de bascule vers un autre serveur
    # parlant le même protocole, sans toucher une ligne de logique de qualification.
    "openai>=2.49.0",
    # Importé directement — les schémas de requête et d'avis en dépendent, ce n'est pas une
    # dépendance transitive de FastAPI qu'on subirait.
    "pydantic>=2.9",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    # `starlette.testclient` importe `httpx2` en premier et déprécie `httpx` ; suivre son choix
    # évite un avertissement à chaque exécution de la suite.
    "httpx2>=2.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qualification_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
