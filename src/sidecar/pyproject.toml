[project]
name = "qualification-sidecar"
version = "1.0.0"
description = "Sidecar de qualification RGPD : les moteurs, derrière un point d'entrée HTTP chacun."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qualification_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
