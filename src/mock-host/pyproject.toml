[project]
name = "mock-host"
version = "1.0.0"
description = "Mock local du système hôte : une route par droit configurable dans le Paramétrage."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    # Même choix que le sidecar : `starlette.testclient` importe `httpx2` en premier et déprécie `httpx`.
    "httpx2>=2.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
